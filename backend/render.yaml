services:
  - type: web
    name: pogoarcade-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://pogoarcade.com
      - key: DB_PATH
        value: /var/data/pogoarcade.db
    disk:
      name: pogoarcade-data
      mountPath: /var/data
      sizeGB: 1
